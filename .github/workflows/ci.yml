name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render all generated outputs
        run: python3 tools/render_all.py

      - name: Verify generated files are up to date
        run: python3 tools/check_generated.py

      - name: Diff profiles (v0 -> v1)
        run: python3 tools/diff_profiles.py profiles/fips-v0-ik-xk.json profiles/fips-v1-xx-draft.json

      - name: Run tests
        run: python3 -m unittest discover tests
